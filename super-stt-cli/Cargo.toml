[package]
    name = "super-stt-cli"
    version.workspace = true
    authors.workspace = true
    edition.workspace = true
    description = "Command-line client for the Super STT daemon (HTTP protocol)"
    repository = "https://github.com/jorge-menjivar/super-stt"
    license = "GPL-3.0-only"

[[bin]]
    name = "super-stt-cli"
    path = "src/main.rs"

[dependencies]
    anyhow.workspace = true
    clap.workspace = true
    super-stt-shared = { path = "../super-stt-shared" }
    tokio = {
        workspace = true,
        features = ["io-util", "macros", "net", "rt-multi-thread"]
    }

[lints]
    workspace = true
